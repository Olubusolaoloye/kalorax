[build]
  # Production builds deploy the Convex functions first when CONVEX_DEPLOY_KEY is set in Netlify.
  # Deploy previews and branch deploys never touch the production backend: they do a plain build,
  # connected to Convex only if VITE_CONVEX_URL is set for them, otherwise in on-device mode.
  command = "npm run build:ci"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: let React Router handle every path.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers on every page. The content security policy only allows our own scripts (plus the one
# inline font-loading handler in index.html, by its hash), Convex for data and photos, Google Fonts, and
# Wikimedia food photos. If you add a new outside service, add its host here or the browser will block it.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-hashes' 'sha256-1jAmyYXcRq6zFldLe/GCgIDJBiOONdXjTLgEFMDnDSM='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://commons.wikimedia.org https://upload.wikimedia.org https://*.convex.cloud; connect-src 'self' https://*.convex.cloud wss://*.convex.cloud https://*.convex.site; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests"

# Always fetch the newest service worker so updates reach users.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# Built JS/CSS files have a content hash in their names, so browsers and Netlify's CDN can keep them for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Food photos come from Wikimedia Commons through Netlify's Image CDN, which resizes them,
# converts them to AVIF or WebP for each browser and caches them near the visitor.
[images]
  remote_images = ["https://upload\\.wikimedia\\.org/.*"]
