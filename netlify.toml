[build]
  # Production builds deploy the Convex functions first when CONVEX_DEPLOY_KEY is set in Netlify.
  # Deploy previews and branch deploys never touch the production backend: they do a plain build,
  # connected to Convex only if VITE_CONVEX_URL is set for them, otherwise in on-device mode.
  command = "npm run build:ci"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: let React Router handle every path.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Always fetch the newest service worker so updates reach users.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# Built JS/CSS files have a content hash in their names, so browsers and Netlify's CDN can keep them for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Food photos come from Wikimedia Commons through Netlify's Image CDN, which resizes them,
# converts them to AVIF or WebP for each browser and caches them near the visitor.
[images]
  remote_images = ["https://upload\\.wikimedia\\.org/.*"]
